name: Release

# Every push to main = a new release with a ready-to-use download.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build (index.html, print.html, LES-MEG.txt)
        run: python3 tools/build.py

      - name: Package Norsken.zip
        run: |
          # ONE download. The files sit straight in the zip (no folder inside a folder):
          # load the unpacked folder as a Chrome/Edge extension, or just double-click index.html.
          mkdir -p dist/Norsken
          cp -r extension/. dist/Norsken/
          cp LES-MEG.txt dist/Norsken/
          sed -i "s/\"version\": \"1.0.0\"/\"version\": \"1.0.${GITHUB_RUN_NUMBER}\"/" dist/Norsken/manifest.json
          grep '"version"' dist/Norsken/manifest.json
          (cd dist/Norsken && zip -qr ../Norsken.zip .)
          cp LES-MEG.txt dist/LES-MEG.txt

      - name: Release notes (everything since the last release)
        run: |
          PREV=$(git tag --list 'v*' --sort=-creatordate | head -1)
          RANGE=${PREV:+$PREV..}HEAD
          {
            echo "## Last ned"
            echo "- **Norsken.zip**: alt i én fil. Legg den inn som utvidelse i Chrome/Edge, eller dobbeltklikk \`index.html\`. Se LES-MEG.txt."
            echo "- **LES-MEG.txt**: bruksanvisning + ResDiary-bokmerkene som tekst (kopier og lim inn)."
            echo
            echo "## Endringer"
            git log --no-merges --reverse --format='- **%s**%n%n%w(0,2,2)%b' $RANGE | cat -s
          } > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/Norsken.zip dist/LES-MEG.txt \
            --target "$GITHUB_SHA" \
            --title "Norsken $(date -u +%d.%m.%Y) (#${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md --latest
