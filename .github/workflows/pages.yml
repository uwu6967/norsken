name: Website

# Puts the planner on https://uwu6967.github.io/norsken/ after every push to main.
# Needs GitHub Pages switched on once: Settings -> Pages -> Source: "GitHub Actions".
# Until then the deploy is skipped (no failed runs).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      ready: ${{ steps.p.outputs.ready }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TYPE=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || true)
          echo "Pages: ${TYPE:-not switched on yet}"
          if [ "$TYPE" = "workflow" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site (the same files as Norsken.zip)
        run: |
          python3 tools/build.py
          mkdir -p site
          cp extension/index.html extension/app.js extension/styles.css extension/print.html extension/print.js extension/icon128.png site/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
